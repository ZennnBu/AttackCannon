
name: Build AttackCannon

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.0'

      - name: Build AttackCannon
        run: gradle build

      - name: Upload AttackCannon JAR
        uses: actions/upload-artifact@v4
        with:
          name: AttackCannon
          path: build/libs/*.jar
          
